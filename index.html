<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sorpresa Especial ❤️</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #0f051d;
      overflow: hidden;
    }

    .font-handwriting {
      font-family: 'Caveat', cursive;
    }

    /* Gradient Background Animation */
    .bg-animated-gradient {
      background: linear-gradient(135deg, #180828, #2a0835, #3d0c3a, #1a0524);
      background-size: 400% 400%;
      animation: gradientShift 12s ease infinite;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Glowing Pulse Effect for Main Button */
    .btn-pulse-glow {
      animation: pulseGlow 2s infinite ease-in-out;
    }

    @keyframes pulseGlow {
      0%, 100% {
        box-shadow: 0 0 20px rgba(244, 63, 94, 0.6), 0 0 40px rgba(244, 63, 94, 0.3);
        transform: scale(1);
      }
      50% {
        box-shadow: 0 0 35px rgba(244, 63, 94, 0.9), 0 0 60px rgba(244, 63, 94, 0.5);
        transform: scale(1.05);
      }
    }

    /* Motion Graphic Pop-Bounce Animation for Center Card */
    .animate-pop-bounce {
      animation: popBounce 0.9s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    @keyframes popBounce {
      0% {
        opacity: 0;
        transform: scale(0.1) translateY(80px) rotate(-8deg);
      }
      60% {
        opacity: 1;
        transform: scale(1.08) translateY(-12px) rotate(2deg);
      }
      80% {
        transform: scale(0.95) translateY(4px) rotate(-1deg);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0) rotate(0deg);
      }
    }

    /* Disappear Button Animation */
    .animate-fade-out-scale {
      animation: fadeOutScale 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    @keyframes fadeOutScale {
      0% {
        opacity: 1;
        transform: scale(1);
      }
      100% {
        opacity: 0;
        transform: scale(0.3);
        visibility: hidden;
      }
    }

    #heartCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }

    /* Subtle Glassmorphism Card Style */
    
  </style>
</head>

<body class="h-screen w-screen flex items-center justify-center bg-animated-gradient overflow-hidden select-none">

  <!-- Audio Element for local musica.mp3 -->
  <audio id="bgMusic" src="musica.mp3" loop preload="auto"></audio>

  <!-- Canvas for Infinite Heart Rain -->
  <canvas id="heartCanvas"></canvas>

  <!-- Outer Wrapper: Simulates Mobile Frame on Desktop, full screen on mobile -->
  <main class="relative w-full h-full max-w-md mx-auto flex flex-col justify-between items-center p-6 z-20">

    <!-- Top Bar Header -->
    <header class="w-full flex justify-between items-center pt-2 px-2 z-30 transition-all duration-500" id="headerBar">
      <div class="flex items-center space-x-2 text-rose-300/80 text-xs font-semibold tracking-wider uppercase">
        <i class="fa-solid fa-sparkles text-rose-400"></i>
      </div>

      <!-- Controls (Mute / Replay) -->
      <div class="flex items-center space-x-2 opacity-0 transition-opacity duration-700" id="controlsGroup">
        <button id="toggleAudioBtn" class="w-10 h-10 rounded-full glass-card flex items-center justify-center text-rose-200 hover:text-white transition active:scale-95" title="Silenciar / Activar Música">
          <i class="fa-solid fa-music" id="audioIcon"></i>
        </button>
        <button id="restartBtn" class="w-10 h-10 rounded-full glass-card flex items-center justify-center text-rose-200 hover:text-white transition active:scale-95" title="Reiniciar">
          <i class="fa-solid fa-rotate-right"></i>
        </button>
      </div>
    </header>

    <!-- Center Section: Holds Button & Interactive Card -->
    <section class="relative w-full flex-1 flex flex-col justify-center items-center my-auto">
      
      <!-- 1. Central Button State -->
      <div id="buttonContainer" class="flex flex-col items-center justify-center z-30">
        <p class="text-rose-200/90 text-sm md:text-base font-medium mb-6 tracking-wide text-center animate-bounce">
          ✨ Cuidado con el boton ✨
        </p>
        
        <button id="mainPressBtn" class="btn-pulse-glow relative group cursor-pointer px-10 py-5 rounded-full bg-gradient-to-r from-rose-500 via-pink-500 to-rose-600 text-white font-extrabold text-xl tracking-wider shadow-2xl transition-transform active:scale-95 flex items-center space-x-3 border-2 border-rose-300/40">
          <i class="fa-solid fa-heart text-rose-200 group-hover:scale-125 transition-transform duration-300"></i>
          <span>Presióname</span>
          <i class="fa-solid fa-heart text-rose-200 group-hover:scale-125 transition-transform duration-300"></i>
        </button>
      </div>

      <!-- 2. Motion Graphic Image Container (Hidden Initially) -->
      <div id="imageCardContainer" class="hidden absolute inset-0 m-auto flex flex-col items-center justify-center w-full max-w-xs z-30 px-2">
        <div class="glass-card w-full rounded-3xl p-4 text-center relative overflow-hidden transform transition-all shadow-2xl  border-rose-400/30">
          
          <!-- Decorative Top Glow -->
          <div class="absolute -top-12 -left-12 w-28 h-28 bg-rose-500/30 rounded-full blur-2xl"></div>
          <div class="absolute -bottom-12 -right-12 w-28 h-28 bg-pink-500/30 rounded-full blur-2xl"></div>

          <!-- Target Image Wrapper -->
          <div class="">
            <img 
              id="targetImage"
              src="imagen.png" 
              alt="Imagen Especial" 
              onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1518199266791-5375a83190b7?q=80&w=800&auto=format&fit=crop';"
            />
            <div class="absolute inset-0 bg-gradient-to-t from-black/50 via-transparent to-transparent opacity-60"></div>
          </div>

          <!-- Heart Caption Badge -->
          <div class="inline-flex items-center space-x-2 px-4 py-1.5 rounded-full bg-rose-500/20  text-rose-200 text-sm font-semibold mb-1">
            <i class="fa-solid fa-heart text-rose-400 text-xs animate-ping"></i>
            <span>Te amo mi princesa👑</span>
          </div>

          <!-- Subtle Subtitle -->
          <p class="text-xs text-rose-200/70 font-light mt-1">
            ¡Espero que ver tu sonrisa! ❤️
          </p>
        </div>
      </div>

    </section>

    <!-- Footer Note -->
    <footer class="w-full text-center pb-2 z-30">
      <p id="footerText" class="text-xs text-rose-300/50 font-light tracking-wide transition-opacity duration-500">
        Elyannini ❤️ Davidini
      </p>
    </footer>

  </main>

  <!-- JavaScript Code -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      
      // DOM Elements
      const mainPressBtn = document.getElementById('mainPressBtn');
      const buttonContainer = document.getElementById('buttonContainer');
      const imageCardContainer = document.getElementById('imageCardContainer');
      const controlsGroup = document.getElementById('controlsGroup');
      const bgMusic = document.getElementById('bgMusic');
      const toggleAudioBtn = document.getElementById('toggleAudioBtn');
      const audioIcon = document.getElementById('audioIcon');
      const restartBtn = document.getElementById('restartBtn');
      const canvas = document.getElementById('heartCanvas');
      const ctx = canvas.getContext('2d');

      let isMusicPlaying = false;
      let heartRainActive = false;
      let audioSynthCtx = null;
      let synthInterval = null;

      function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      resizeCanvas();
      window.addEventListener('resize', resizeCanvas);

      // Synthetic Romantic Melody Engine (Fallback if musica.mp3 is missing during preview)
      function startSynthMelody() {
        try {
          if (!audioSynthCtx) {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioSynthCtx = new AudioContext();
          }

          if (audioSynthCtx.state === 'suspended') {
            audioSynthCtx.resume();
          }

          // Ambient chord notes (Cmaj7 / Am7 / Fmaj7 / G7 in Hz)
          const chords = [
            [261.63, 329.63, 392.00, 493.88], // Cmaj7
            [220.00, 261.63, 329.63, 392.00], // Am7
            [174.61, 220.00, 261.63, 329.63], // Fmaj7
            [196.00, 246.94, 293.66, 349.23]  // G7
          ];

          let chordIdx = 0;

          function playChordStep() {
            if (!isMusicPlaying || !audioSynthCtx) return;
            const currentChord = chords[chordIdx];
            chordIdx = (chordIdx + 1) % chords.length;

            currentChord.forEach((freq, i) => {
              const osc = audioSynthCtx.createOscillator();
              const gain = audioSynthCtx.createGain();
              
              osc.type = 'sine';
              osc.frequency.setValueAtTime(freq, audioSynthCtx.currentTime);

              // Soft acoustic envelope
              gain.gain.setValueAtTime(0, audioSynthCtx.currentTime);
              gain.gain.linearRampToValueAtTime(0.04, audioSynthCtx.currentTime + 0.4 + (i * 0.1));
              gain.gain.exponentialRampToValueAtTime(0.0001, audioSynthCtx.currentTime + 2.8);

              osc.connect(gain);
              gain.connect(audioSynthCtx.destination);

              osc.start(audioSynthCtx.currentTime + (i * 0.08));
              osc.stop(audioSynthCtx.currentTime + 3.0);
            });
          }

          playChordStep();
          synthInterval = setInterval(playChordStep, 2600);
        } catch (e) {
          console.log("Audio synth fallback initialized");
        }
      }

      function stopSynthMelody() {
        if (synthInterval) {
          clearInterval(synthInterval);
          synthInterval = null;
        }
      }

      // Main audio start function
      function startMusic() {
        bgMusic.volume = 0.7;
        const playPromise = bgMusic.play();

        if (playPromise !== undefined) {
          playPromise.then(() => {
            isMusicPlaying = true;
            updateAudioIcon();
          }).catch(() => {
            // If local mp3 not found or blocked, use Web Audio API smooth synth fallback
            isMusicPlaying = true;
            startSynthMelody();
            updateAudioIcon();
          });
        }
      }

      function toggleMusic() {
        if (isMusicPlaying) {
          bgMusic.pause();
          stopSynthMelody();
          isMusicPlaying = false;
        } else {
          startMusic();
        }
        updateAudioIcon();
      }

      function updateAudioIcon() {
        if (isMusicPlaying) {
          audioIcon.className = 'fa-solid fa-volume-high text-rose-400';
        } else {
          audioIcon.className = 'fa-solid fa-volume-xmark text-gray-400';
        }
      }

      // Particle Class for Tiny Red and Pink Falling Hearts
      class HeartParticle {
        constructor() {
          this.reset(true);
        }

        reset(initial = false) {
          this.x = Math.random() * canvas.width;
          this.y = initial ? Math.random() * canvas.height : -20;
          this.size = Math.random() * 12 + 10; // Small size (10px to 22px)
          this.speedY = Math.random() * 1.5 + 1.2; // Smooth gentle fall speed
          this.speedX = Math.random() * 0.8 - 0.4;
          
          // Swaying sine movement
          this.swayAmp = Math.random() * 1.5 + 0.5;
          this.swayFreq = Math.random() * 0.03 + 0.01;
          this.phase = Math.random() * Math.PI * 2;

          // Rotation
          this.rotation = Math.random() * Math.PI * 2;
          this.rotationSpeed = (Math.random() - 0.5) * 0.03;

          // Colors: Tiny Red and Pink Palette
          const colors = [
            '#ff2a6d', // Bright Red-Pink
            '#ff5376', // Deep Rose Red
            '#ff758c', // Soft Coral Pink
            '#e60049', // Crimson Red
            '#ff9ebb', // Light Pastel Pink
            '#ff3b5c'  // Vivid Red
          ];
          this.color = colors[Math.floor(Math.random() * colors.length)];
          
          // Opacity & Fade logic
          this.maxOpacity = Math.random() * 0.6 + 0.4;
          this.opacity = this.maxOpacity;
        }

        update() {
          this.phase += this.swayFreq;
          this.x += this.speedX + Math.sin(this.phase) * this.swayAmp;
          this.y += this.speedY;
          this.rotation += this.rotationSpeed;

          // Fade out near the bottom
          const bottomThreshold = canvas.height - 120;
          if (this.y > bottomThreshold) {
            this.opacity -= 0.015;
          }

          // Reset when out of screen or invisible
          if (this.y > canvas.height + 20 || this.opacity <= 0) {
            this.reset(false);
          }
        }

        draw() {
          ctx.save();
          ctx.translate(this.x, this.y);
          ctx.rotate(this.rotation);
          ctx.globalAlpha = Math.max(0, this.opacity);
          ctx.fillStyle = this.color;

          // Render heart shape path
          ctx.beginPath();
          const d = this.size;
          ctx.moveTo(0, 0);
          ctx.bezierCurveTo(-d / 2, -d / 2, -d, d / 3, 0, d);
          ctx.bezierCurveTo(d, d / 3, d / 2, -d / 2, 0, 0);
          ctx.fill();
          ctx.restore();
        }
      }

      // Initialize Heart Particles Array (~55 small floating hearts)
      const particleCount = 55;
      const particles = [];
      for (let i = 0; i < particleCount; i++) {
        particles.push(new HeartParticle());
      }

      // Animation Loop for Canvas
      function animateHearts() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (heartRainActive) {
          particles.forEach(p => {
            p.update();
            p.draw();
          });
        }

        requestAnimationFrame(animateHearts);
      }

      // Start canvas loop
      animateHearts();

      // 1. On Click "Presióname" Button Event
      mainPressBtn.addEventListener('click', () => {
        // Step A: Fade out & scale down main button
        buttonContainer.classList.add('animate-fade-out-scale');

        setTimeout(() => {
          buttonContainer.style.display = 'none';

          // Step B: Play background music
          startMusic();

          // Step C: Start Infinite Heart Rain
          heartRainActive = true;

          // Step D: Show controls header
          controlsGroup.classList.remove('opacity-0');

          // Step E: Pop-Bounce Motion Graphic Image Container
          imageCardContainer.classList.remove('hidden');
          imageCardContainer.classList.add('animate-pop-bounce');

        }, 400);
      });

      // Toggle Audio Button Event
      toggleAudioBtn.addEventListener('click', () => {
        toggleMusic();
      });

      // Restart Button Event
      restartBtn.addEventListener('click', () => {
        // Reset view
        imageCardContainer.classList.remove('animate-pop-bounce');
        imageCardContainer.classList.add('hidden');
        buttonContainer.style.display = 'flex';
        buttonContainer.classList.remove('animate-fade-out-scale');
        
        heartRainActive = false;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // Reset particles positions
        particles.forEach(p => p.reset(true));
      });

    });
  </script>
</body>
</html>
